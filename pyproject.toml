[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvemcq-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["qdrant-client>=1.14,<2"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
review = ["mcp>=1.30,<2"]

[project.scripts]
solvemcq = "solvemcq.cli:main"
solvemcq-review = "solvemcq.review_server:main"

[tool.setuptools.packages.find]
include = ["solvemcq*"]
